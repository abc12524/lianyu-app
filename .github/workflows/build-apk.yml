name: Build LianYu APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Fix gradlew permission
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        run: ./gradlew --version

      - name: Switch debug to unsigned (CI doesn't need store signing)
        run: |
          # Debug 构建去除签名配置 — 使用默认 Android debug 签名
          sed -i '/^[[:space:]]*debug {/,/^[[:space:]]*}/{/signingConfig/d}' app/build.gradle.kts
          # 密码兜底
          sed -i 's|"debug_password_placeholder"|"android"|' app/build.gradle.kts

      - name: Auto-increment versionCode
        run: |
          OLD=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          NEW=$((OLD + 1))
          sed -i "s/versionCode = $OLD/versionCode = $NEW/" app/build.gradle.kts
          echo "versionCode: $OLD -> $NEW"
          sed -i 's/versionName = "\(.*\)"/versionName = "\1.build.'$GITHUB_RUN_NUMBER'"/' app/build.gradle.kts
          echo "versionName build.$GITHUB_RUN_NUMBER"

      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          LIANYU_STORE_PASSWORD: ${{ secrets.LIANYU_STORE_PASSWORD }}
          LIANYU_KEY_ALIAS: ${{ secrets.LIANYU_KEY_ALIAS }}
          LIANYU_KEY_PASSWORD: ${{ secrets.LIANYU_KEY_PASSWORD }}
        run: |
          if [ -n "$LIANYU_STORE_PASSWORD" ] && [ -n "$LIANYU_KEY_ALIAS" ] && [ -n "$LIANYU_KEY_PASSWORD" ]; then
            echo "${{ secrets.LIANYU_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            ./gradlew assembleRelease --no-daemon --stacktrace --no-build-cache
          else
            echo "WARNING: Release signing Secrets not configured, skipping Release build"
          fi

      - name: Rename Debug APK
        id: rename_debug
        run: |
          mkdir -p release-assets
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d-%H%M%S)
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          DEST="release-assets/LianYu-debug-${VER}-${DATE}-${SHORT_SHA}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=build-${VER}-${DATE}" >> "$GITHUB_OUTPUT"

      - name: Rename Release APK (if exists)
        id: rename_release
        if: github.event_name != 'pull_request'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d-%H%M%S)
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          SRC=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$SRC" ]; then
            DEST="release-assets/LianYu-release-${VER}-${DATE}-${SHORT_SHA}.apk"
            cp "$SRC" "$DEST"
            echo "release_apk_path=$DEST" >> "$GITHUB_OUTPUT"
          else
            echo "release_apk_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LianYu-debug
          path: ${{ steps.rename_debug.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload Release APK
        if: steps.rename_release.outputs.release_apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: LianYu-release
          path: ${{ steps.rename_release.outputs.release_apk_path }}
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename_debug.outputs.tag }}
          name: "LianYu v${{ steps.rename_debug.outputs.version }}"
          body: |
            Auto-built APK.
            - Version: `${{ steps.rename_debug.outputs.version }}`
            - Commit: `${{ github.sha }}`
            - Event: `${{ github.event_name }}`
            - Branch: `${{ github.ref_name }}`
          prerelease: true
          files: |
            ${{ steps.rename_debug.outputs.apk_path }}
            ${{ steps.rename_release.outputs.release_apk_path }}
